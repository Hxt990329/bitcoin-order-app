# .github/workflows/build.yml
# 最终修正版：使用 npm run lint 来确保找到 ng命令

name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: 'npm'

      # 3. 安装所有依赖
      - name: Install All Dependencies
        run: npm install

      # =======================================================
      # == 核心修正：使用 'npm run lint'
      # == npm 会自动处理 ng 命令的路径问题
      # =======================================================
      - name: Static Code Analysis (Lint)
        run: npm run lint

      # 5. 执行漏洞扫描
      - name: Vulnerability Scan (Audit)
        run: npm audit

      # 6. 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # 7. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bitcoin-order-app:latest


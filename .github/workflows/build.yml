name: Bitcoin order App CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # 获取所有历史记录，这对 conventional-changelog 至关重要
          fetch-depth: 0

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
          # 缓存 npm 依赖，加快安装速度
          cache: 'npm'

      # 3. 安装依赖
      # 'npm ci' 比 'npm install' 更快、更可靠，适合 CI 环境
      - name: Install dependencies
        run: npm ci

      # =================================================================
      # == 作业要求：静态代码分析和漏洞扫描
      # =================================================================
      
      # 4. (Bonus) 执行静态代码分析 (ng lint)
      - name: Static Code Analysis (Lint)
        run: ng lint

      # 5. (Bonus) 执行漏洞扫描 (npm audit)
      # 使用 'npm audit' 而不是 'npm audit fix'，因为在 CI 中我们只想发现问题而不是自动修复
      - name: Vulnerability Scan (Audit)
        run: npm audit

      # 6. 构建 Angular 应用
      - name: Build application
        run: npm run build -- --configuration production

      # (测试步骤被注释掉了，暂时不执行)
      # - name: Run tests
      #   run: npm test -- --watch=false --browsers=ChromeHeadless
      
      # =================================================================
      # == 作业要求：自动生成版本和 Release
      # =================================================================

      # 7. (Bonus) 自动生成 Changelog、更新版本号并创建 Git Tag
      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          # 我们不再需要单独的 create-release 步骤，这个 action 会自动完成
          output-file: "false"

      # =================================================================
      # == 作业要求：Docker 化并推送到 Docker Hub
      # =================================================================
      
      # 8. (Bonus) 登录到 Docker Hub
      - name: Login to Docker Hub
        if: ${{ steps.changelog.outputs.skipped == 'false' }} # 仅在新版本发布时运行
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # 9. (Bonus) 构建并推送 Docker 镜像
      - name: Build and push Docker image
        if: ${{ steps.changelog.outputs.skipped == 'false' }} # 仅在新版本发布时运行
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 镜像标签将是 '你的用户名/app名:版本号' 和 '你的用户名/app名:latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bitcoin-order-app:${{ steps.changelog.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bitcoin-order-app:latest

      # =================================================================
      # == 原有功能：部署到 GitHub Pages
      # =================================================================
      
      # 10. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        run: npm run deploy
